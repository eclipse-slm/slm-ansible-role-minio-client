---
- name: "MINIO | Assert inputs of 'minio/client | create_user.yml'"
  ansible.builtin.assert:
    that:
      - (minio.url.api.internal is defined) and (minio.url.api.internal|length > 0)
      - (_minio_root_user is defined) and (_minio_root_user|length > 0)
      - (_minio_root_password is defined) and (_minio_root_password|length > 0)
      - (_alias is defined) and (_alias|length > 0)
      - (_user is defined) and (_user|length > 0)
      - (_password is defined) and (_password|length > 0)
      - (_access_key is defined) and (_access_key|length > 0)
      - (_secret_key is defined) and (_secret_key|length > 0)
    fail_msg: "Variable must be defined and not empty"

- name: "MINIO | Install Minio Client"
  ansible.builtin.import_tasks: install_mc.yml
  vars:
    _minio_alias: "{{ _alias }}"

- name: "MINIO | Set secure mc command"
  ansible.builtin.set_fact:
    mc_command: "mc"

- name: "Assert user was created"
  ansible.builtin.command: "{{ mc_command }} admin user list {{ _alias }}"
  register: user_list
  changed_when: false

- name: "MINIO | Create user"
  when: _user not in user_list.stdout
  ansible.builtin.command: "{{ mc_command }} admin user add {{ _alias }} {{ _user }} \"{{ _password }}\""

- name: "MINIO | Get policies attached to user"
  ansible.builtin.command: "{{ mc_command }} admin policy entities {{ _alias }} --user {{ _user }} --json"
  register: user_policies
  changed_when: false

- name: "MINIO | Get policies attached to user"
  ansible.builtin.include_tasks: get_policies_attached_to_user.yml

- name: "MINIO | Attach user to policy"
  when: "'readwrite' not in minio_user_policies_attached"
  ansible.builtin.command: "{{ mc_command }} admin policy attach {{ _alias }} readwrite --user {{ _user }}"
  ignore_errors: true

- name: "MINIO | Add user to svcacct"
  ansible.builtin.command: "{{ mc_command }} admin user svcacct add --access-key {{ _access_key }} --secret-key {{ _secret_key }} {{ _alias }} {{ _user }}"
  register: add_user_svcacct
  changed_when: add_user_svcacct.rc == 0
  failed_when:
    - add_user_svcacct.rc != 0
    - add_user_svcacct.stderr is defined and "already taken" not in add_user_svcacct.stderr
  ignore_errors: true
