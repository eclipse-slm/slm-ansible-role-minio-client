---
### INPUTS:
- name: "MINIO_CLIENT | Assert inputs | install_mc.yml"
  ansible.builtin.assert:
    that:
      - (minio.url.api.internal is defined) and (minio.url.api.internal|length > 0)
      - (_minio_root_user is defined) and (_minio_root_user|length > 0)
      - (_minio_root_password is defined) and (_minio_root_password|length > 0)
    fail_msg: "Variable must be defined and not empty"

### OPTIONAL
# - _minio_alias=<string> # Alias for the Minio server (default: slm)

- name: "MINIO_CLIENT | Check if Minio Client is installed"
  ansible.builtin.command: "mc --version"
  changed_when: false
  failed_when: false
  register: mc_check

- name: "MINIO_CLIENT | Download Minio Client"
  when: mc_check.rc != 0
  ansible.builtin.get_url:
    url: "{{ mc_download_url }}"
    dest: "{{ mc_bin_path }}"
    mode: '0755'
    checksum: "{{ ('sha256:' ~ mc_sha256[mc_arch]) if mc_arch in mc_sha256 else omit }}"
  register: mc_download
  changed_when: mc_download is changed

- name: "MINIO_CLIENT | Check if Minio Client is installed"
  ansible.builtin.command: "mc --version"
  changed_when: false
  failed_when: false

- name: "MINIO_CLIENT | Set secure mc command"
  ansible.builtin.set_fact:
    mc_command: "mc"

- name: "MINIO_CLIENT | Configure minio connection alias"
  ansible.builtin.command: "{{ mc_command }} alias set {{ _minio_alias | default('slm') }} {{ minio.url.api.internal }} {{ _minio_root_user }} {{ _minio_root_password }}"
  register: alias_command
  changed_when: false
  failed_when: success_txt not in alias_command.stdout
  vars:
    success_txt: "Added `{{ _minio_alias | default('slm') }}` successfully."
